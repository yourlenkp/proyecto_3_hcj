<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Registro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primario:#6366f1;
  --primario-oscuro:#4f46e5;
  --exito:#10b981;
  --peligro:#ef4444;
  --texto:#1e293b;
  --texto-suave:#64748b;
  --borde:#e2e8f0;
  --radio:14px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}

html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
}

::selection{
  background:rgba(99,102,241,.3);
}

body{
  min-height:100vh;
  min-height:100dvh;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);
  padding:clamp(20px,4vw,40px) clamp(12px,4vw,20px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(12px,2.5vw,20px);
  position:relative;
  overflow-x:hidden;
}

body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(90px);
  opacity:.35;
  z-index:0;
  pointer-events:none;
}

body::before{
  width:420px;
  height:420px;
  background:#6366f1;
  top:-120px;
  left:-120px;
  animation:flotar 12s ease-in-out infinite alternate;
}

body::after{
  width:380px;
  height:380px;
  background:#06b6d4;
  bottom:-100px;
  right:-100px;
  animation:flotar 14s ease-in-out infinite alternate-reverse;
}

@keyframes flotar{
  from{transform:translate(0,0) scale(1);}
  to{transform:translate(40px,30px) scale(1.1);}
}

@keyframes aparecer{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes temblor{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
}

.titulo-principal{
  color:#f8fafc;
  font-size:clamp(1.45rem,4.5vw,1.95rem);
  font-weight:800;
  text-align:center;
  z-index:1;
  letter-spacing:-.5px;
  margin-bottom:5px;
  line-height:1.25;
  text-wrap:balance;
  padding:0 4px;
}

.titulo-principal span{
  background:linear-gradient(90deg,#818cf8,#22d3ee);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitulo{
  color:#94a3b8;
  text-align:center;
  z-index:1;
  font-size:clamp(.85rem,2.5vw,.95rem);
  margin-bottom:10px;
  padding:0 8px;
  line-height:1.5;
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:var(--texto);
  font-size:clamp(1.15rem,3.5vw,1.3rem);
  font-weight:700;
  line-height:1.3;
}

h3{
  text-align:center;
  margin-bottom:15px;
  color:#334155;
}

.card{
  background:rgba(255,255,255,.97);
  padding:clamp(22px,4.5vw,34px);
  max-width:520px;
  width:100%;
  margin:0 auto;
  border-radius:clamp(16px,3vw,20px);
  box-shadow:0 25px 50px -12px rgba(0,0,0,.45);
  z-index:1;
  animation:aparecer .45s ease both;
  border:1px solid rgba(255,255,255,.6);
}

#panel.card{
  max-width:900px;
}

.contenedor-login{
  width:100%;
  max-width:520px;
  z-index:1;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="file"]){
  width:100%;
  min-height:48px;
  padding:13px 16px;
  margin:8px 0;
  border:2px solid var(--borde);
  border-radius:12px;
  font-size:1rem;
  color:var(--texto);
  background:#f8fafc;
  transition:border-color .2s,box-shadow .2s,background .2s;
  outline:none;
  appearance:none;
}

input::placeholder{
  color:#94a3b8;
  opacity:1;
}

input:focus{
  border-color:var(--primario);
  background:#fff;
  box-shadow:0 0 0 4px rgba(99,102,241,.15);
}

button{
  min-height:44px;
  padding:12px 24px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--primario),var(--primario-oscuro));
  color:white;
  font-weight:600;
  font-family:inherit;
  font-size:.92rem;
  transition:transform .15s,box-shadow .2s,filter .2s;
  box-shadow:0 4px 14px rgba(79,70,229,.35);
  touch-action:manipulation;
}

button:focus-visible,
.btn-archivo:focus-visible{
  outline:3px solid rgba(129,140,248,.7);
  outline-offset:2px;
}

button:hover{
  filter:brightness(1.1);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(79,70,229,.45);
}

button:active{
  transform:translateY(0) scale(.97);
}

.botonera-login,
.botonera-rol{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:14px;
  flex-wrap:wrap;
}

.botonera-login button,
.botonera-rol button{
  flex:1 1 auto;
}

.btn-rol-activo{
  background:linear-gradient(135deg,#10b981,#059669) !important;
  box-shadow:0 8px 20px rgba(16,185,129,.45) !important;
  transform:translateY(-2px);
}

.btn-rol-off,
.btn-oculto,
.oculto{
  display:none;
}

.btn-archivo{
  display:block;
  margin-top:18px;
  padding:13px 24px;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(135deg,#10b981,#059669);
  color:white;
  font-weight:600;
  text-align:center;
  transition:transform .15s,box-shadow .2s,filter .2s;
  box-shadow:0 4px 14px rgba(5,150,105,.35);
}

.btn-archivo:hover{
  filter:brightness(1.1);
  transform:translateY(-2px);
}

.estado-archivo{
  margin-top:14px;
  text-align:center;
  font-size:.82rem;
  color:#64748b;
  line-height:1.4;
  word-break:break-word;
}

.estado-archivo.conectado{
  color:#059669;
  font-weight:600;
}

.btn-peligro{
  background:linear-gradient(135deg,#ef4444,#dc2626);
  box-shadow:0 4px 14px rgba(220,38,38,.35);
}

.btn-excel{
  background:linear-gradient(135deg,#10b981,#059669);
  box-shadow:0 4px 14px rgba(5,150,105,.35);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:20px;
}

.grid input{
  margin:0;
}

#direccion{
  grid-column:1 / -1;
}

.acciones{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:22px;
  flex-wrap:wrap;
}

.acciones button{
  flex:1 1 150px;
  max-width:260px;
  padding:12px 18px;
  white-space:nowrap;
}

.encabezado{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:10px;
}

.encabezado h2{
  margin-bottom:0;
  text-align:left;
  flex:1 1 auto;
  min-width:0;
  overflow-wrap:anywhere;
}

#usuarioActivo{
  color:var(--primario);
}

.activar-formulario{
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:center;
  margin:18px 0 5px;
  color:#475569;
  font-weight:600;
  cursor:pointer;
  user-select:none;
}

.activar-formulario input{
  width:18px;
  height:18px;
  accent-color:#6366f1;
  cursor:pointer;
}

.contador-badge{
  display:inline-block;
  margin-top:22px;
  background:linear-gradient(135deg,#6366f1,#4f46e5);
  color:#fff;
  padding:10px 22px;
  border-radius:999px;
  font-weight:700;
  font-size:.95rem;
  box-shadow:0 4px 14px rgba(79,70,229,.35);
}

.contador-badge span{
  font-size:1.1rem;
}

#toast{
  position:fixed;
  bottom:25px;
  right:25px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:340px;
}

.toast-msg{
  padding:14px 18px;
  border-radius:12px;
  color:#fff;
  font-weight:600;
  font-size:.9rem;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
  animation:aparecer .3s ease both;
  border-left:5px solid rgba(255,255,255,.4);
}

.toast-exito{
  background:linear-gradient(135deg,#10b981,#059669);
}

.toast-error{
  background:linear-gradient(135deg,#ef4444,#dc2626);
  animation:aparecer .3s ease both,temblor .4s ease;
}

.toast-info{
  background:linear-gradient(135deg,#6366f1,#4f46e5);
}

hr{
  border:none;
  border-top:2px solid #e2e8f0;
  margin:18px 0;
}

@media(max-width:900px){
  #panel.card{
    max-width:100%;
  }
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
  #direccion{
    grid-column:auto;
  }
  .acciones{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .acciones button{
    width:100%;
    max-width:none;
  }
  .encabezado{
    flex-direction:column;
    align-items:stretch;
    text-align:center;
  }
  .encabezado h2{
    text-align:center;
  }
  .encabezado button{
    width:100%;
  }
  #toast{
    left:12px;
    right:12px;
    bottom:12px;
    max-width:none;
  }
}

@media(max-width:520px){
  body{
    padding:20px 12px 28px;
    gap:14px;
  }
  .card{
    padding:20px 16px;
  }
  .botonera-rol{
    display:grid;
    grid-template-columns:1fr 1fr;
  }
  .botonera-login{
    display:grid;
    grid-template-columns:1fr;
  }
  .botonera-login button,
  .botonera-rol button{
    width:100%;
  }
  .btn-archivo{
    padding:14px 16px;
    font-size:.9rem;
  }
  .contador-badge{
    display:block;
    width:100%;
    padding:12px 16px;
  }
  .toast-msg{
    padding:12px 14px;
    font-size:.85rem;
  }
  .estado-archivo{
    font-size:.78rem;
  }
}

@media(max-width:380px){
  body{
    padding:16px 10px 24px;
  }
  .card{
    padding:18px 14px;
    border-radius:14px;
  }
  .acciones{
    grid-template-columns:1fr;
  }
  .titulo-principal{
    font-size:1.3rem;
  }
}

@media(hover:none){
  button:hover,
  .btn-archivo:hover{
    transform:none;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body>

<h1 class="titulo-principal">Sistema de <span>Registro de Estudiantes</span></h1>
<p class="subtitulo">Seleccione su rol para iniciar sesión</p>

<div class="contenedor-login">

  <div class="card">

    <h2>Inicio de Sesión</h2>

    <div class="botonera-rol">
      <button id="btnRolAdmin" onclick="elegirRol('admin')">Administrador</button>
      <button id="btnRolEstudiante" onclick="elegirRol('estudiante')">Estudiantes</button>
    </div>

    <input type="text" id="correoLogin" placeholder="Seleccione un rol" autocomplete="off">

    <input type="password" id="passwordLogin" placeholder="Contraseña" onkeydown="if(event.key==='Enter')ingresar()">

    <div class="botonera-login">
      <button onclick="ingresar()">Ingresar</button>
      <button id="btnRegistrarLogin" class="btn-oculto" onclick="registrar()">Registrar</button>
      <button id="btnEliminarLogin" class="btn-oculto btn-peligro" onclick="eliminarUsuario()">Eliminar</button>
    </div>

    <label class="btn-archivo" onclick="return manejarAbrirArchivo(event)">
      Conectar registros.xlsx
      <input type="file" id="archivoUsuarios" accept=".xlsx" class="oculto" onchange="importarUsuarios(event)">
    </label>

    <p id="estadoArchivo" class="estado-archivo"></p>

  </div>

</div>

<!-- REGISTRO NUEVO -->

<div id="registroUsuario" class="card oculto">

  <h2>Registro de Estudiante</h2>

  <input type="text" id="nombreRegistro" placeholder="Nombre Completo">

  <input type="email" id="correoRegistro" placeholder="Correo">

  <input type="text" id="cedulaRegistro" placeholder="Cédula">

  <input type="text" id="telefonoRegistro" placeholder="Teléfono">

  <input type="text" id="direccionRegistro" placeholder="Dirección">

  <div class="acciones">
    <button onclick="guardarUsuario()">Crear Cuenta</button>
  </div>

</div>

<!-- PANEL PRINCIPAL -->

<div id="panel" class="card oculto">

  <div class="encabezado">

    <h2>
      Bienvenido:
      <span id="usuarioActivo"></span>
    </h2>

    <button class="btn-peligro" onclick="cerrarSesion()">Salir</button>

  </div>

  <hr>

  <h2>Formulario de Registro</h2>

  <label class="activar-formulario">
    <input type="radio" id="activar">
    Activar Formulario
  </label>

  <div class="grid">

    <input id="cedula" placeholder="CEDULA">
    <input id="nombre1" placeholder="NOMBRE 1">
    <input id="nombre2" placeholder="NOMBRE 2">
    <input id="apellido1" placeholder="APELLIDO 1">
    <input id="apellido2" placeholder="APELLIDO 2">
    <input id="telefono" placeholder="TELEFONO">
    <input id="direccion" placeholder="DIRECCION">

  </div>

  <br>

  <input id="buscarCedula" placeholder="Buscar por cédula" onkeydown="if(event.key==='Enter')consultarRegistro()">

  <div class="acciones">

    <button id="btnGuardar" onclick="guardarRegistro()">Guardar</button>

    <button id="btnConsultar" onclick="consultarRegistro()">Consultar</button>

    <button id="btnEditar" onclick="editarRegistro()">Editar</button>

    <button id="btnEliminar" class="btn-peligro" onclick="eliminarRegistro()">Eliminar</button>

    <button id="btnExcel" class="btn-excel" onclick="guardarExcel()">Guardar en Excel</button>

    <button class="btn-excel" onclick="conectarArchivo()">Conectar archivo</button>

  </div>

  <div style="text-align:center">
    <div class="contador-badge">
      Total Registrados: <span id="contador">0</span>
    </div>
    <p id="estadoArchivoPanel" class="estado-archivo"></p>
  </div>

</div>

<div id="toast"></div>

<script>
const ADMIN_FIJO = {
  usuario:"Arturo",
  password:"123",
  rol:"admin",
  nombre:"Arturo"
};

let usuarioActual = null;

let rolLogin = "";

if(!localStorage.getItem("usuarios")){
  localStorage.setItem("usuarios", JSON.stringify([]));
}

function toast(mensaje, tipo){

  tipo = tipo || "info";

  const contenedor = document.getElementById("toast");

  const div = document.createElement("div");

  div.className = "toast-msg toast-" + tipo;

  div.innerText = mensaje;

  contenedor.appendChild(div);

  setTimeout(()=>{
    div.style.opacity = "0";
    div.style.transition = "opacity .4s";
    setTimeout(()=>div.remove(), 400);
  }, 3200);
}

function elegirRol(rol){

  rolLogin = rol;

  const btnAdmin = document.getElementById("btnRolAdmin");
  const btnEst = document.getElementById("btnRolEstudiante");

  btnAdmin.classList.remove("btn-rol-activo","btn-rol-off");
  btnEst.classList.remove("btn-rol-activo","btn-rol-off");

  const correo = document.getElementById("correoLogin");

  if(rol==="admin"){

    btnAdmin.classList.add("btn-rol-activo");
    btnEst.classList.add("btn-rol-off");

    correo.placeholder = "Usuario";

    document.getElementById("btnRegistrarLogin").classList.remove("btn-oculto");
    document.getElementById("btnEliminarLogin").classList.remove("btn-oculto");

    correo.focus();

  }else{

    btnEst.classList.add("btn-rol-activo");
    btnAdmin.classList.add("btn-rol-off");

    correo.placeholder = "Correo";

    document.getElementById("btnRegistrarLogin").classList.add("btn-oculto");
    document.getElementById("btnEliminarLogin").classList.add("btn-oculto");

    correo.focus();
  }

  correo.value = "";
  document.getElementById("passwordLogin").value = "";
}

function registrar(){
  document.getElementById("registroUsuario").classList.remove("oculto");
  document.getElementById("nombreRegistro").focus();
}

function guardarUsuario(){

  const nombre = document.getElementById("nombreRegistro").value.trim();
  const correo = document.getElementById("correoRegistro").value.trim();
  const cedula = document.getElementById("cedulaRegistro").value.trim();
  const telefono = document.getElementById("telefonoRegistro").value.trim();
  const direccion = document.getElementById("direccionRegistro").value.trim();

  if(!nombre || !correo || !cedula){
    toast("Complete nombre, correo y cédula", "error");
    return;
  }

  let usuarios = JSON.parse(localStorage.getItem("usuarios"));

  if(usuarios.some(u=>u.correo===correo)){
    toast("El correo ya existe", "error");
    return;
  }

  const estudiante = {
    nombre,
    correo,
    password:cedula,
    rol:"estudiante",
    cedula,
    telefono,
    direccion
  };

  usuarios.push(estudiante);

  localStorage.setItem("usuarios", JSON.stringify(usuarios));

  usuarioActual = estudiante;

  sincronizarArchivo();

  mostrarPanel();

  toast("Registro exitoso. Su contraseña inicial es su cédula.", "exito");
}

function ingresar(){

  const valor = document.getElementById("correoLogin").value.trim();
  const password = document.getElementById("passwordLogin").value;

  if(!rolLogin){
    toast("Seleccione Administrador o Estudiantes", "error");
    return;
  }

  if(!valor || !password){
    toast("Complete todos los campos", "error");
    return;
  }

  if(rolLogin==="admin"){

    const usuarios = JSON.parse(localStorage.getItem("usuarios"));

    const adminImportado = usuarios.find(
      u=>u.rol==="admin" && u.usuario===valor && u.password===password
    );

    if((valor===ADMIN_FIJO.usuario && password===ADMIN_FIJO.password) || adminImportado){
      usuarioActual = adminImportado || ADMIN_FIJO;
      mostrarPanel();
      toast("Bienvenido " + usuarioActual.nombre, "exito");
      return;
    }

    toast("Usuario o contraseña incorrectos", "error");
    return;
  }

  const usuarios = JSON.parse(localStorage.getItem("usuarios"));

  const encontrado = usuarios.find(
    u=>u.rol==="estudiante" && u.correo===valor && u.password===password
  );

  if(!encontrado){
    toast("Credenciales incorrectas", "error");
    return;
  }

  usuarioActual = encontrado;

  mostrarPanel();

  toast("Bienvenido " + usuarioActual.nombre, "exito");
}

function mostrarPanel(){

  document.querySelector(".contenedor-login").style.display="none";

  document.getElementById("registroUsuario").classList.add("oculto");

  document.getElementById("panel").classList.remove("oculto");

  document.getElementById("usuarioActivo").innerText = usuarioActual.nombre;

  actualizarContador();

  if(usuarioActual.rol==="estudiante"){

    document.getElementById("btnEliminar").style.display="none";
    document.getElementById("btnExcel").style.display="none";

    cargarDatosEstudiante();
  }
}

function cargarDatosEstudiante(){
  document.getElementById("cedula").value = usuarioActual.cedula || "";
  document.getElementById("telefono").value = usuarioActual.telefono || "";
  document.getElementById("direccion").value = usuarioActual.direccion || "";
}

function cerrarSesion(){
  location.reload();
}

function obtenerRegistros(){
  return JSON.parse(localStorage.getItem("registros")) || [];
}

function guardarRegistro(){

  let registros = obtenerRegistros();

  const registro = {
    cedula: document.getElementById("cedula").value.trim(),
    nombre1: document.getElementById("nombre1").value.trim(),
    nombre2: document.getElementById("nombre2").value.trim(),
    apellido1: document.getElementById("apellido1").value.trim(),
    apellido2: document.getElementById("apellido2").value.trim(),
    telefono: document.getElementById("telefono").value.trim(),
    direccion: document.getElementById("direccion").value.trim()
  };

  if(!registro.cedula){
    toast("La cédula es obligatoria", "error");
    return;
  }

  const existe = registros.find(r => r.cedula === registro.cedula);

  if(existe){
    toast("La cédula ya existe", "error");
    return;
  }

  registros.push(registro);

  localStorage.setItem("registros", JSON.stringify(registros));

  actualizarContador();

  sincronizarArchivo();

  toast("Guardado correctamente", "exito");
}

function consultarRegistro(){

  const cedula = document.getElementById("buscarCedula").value.trim();

  const registros = obtenerRegistros();

  const encontrado = registros.find(r=>r.cedula===cedula);

  if(!encontrado){
    toast("No encontrado", "error");
    return;
  }

  document.getElementById("cedula").value=encontrado.cedula;
  document.getElementById("nombre1").value=encontrado.nombre1;
  document.getElementById("nombre2").value=encontrado.nombre2;
  document.getElementById("apellido1").value=encontrado.apellido1;
  document.getElementById("apellido2").value=encontrado.apellido2;
  document.getElementById("telefono").value=encontrado.telefono;
  document.getElementById("direccion").value=encontrado.direccion;

  toast("Registro encontrado", "exito");
}

function editarRegistro(){

  const cedula = document.getElementById("cedula").value.trim();

  let registros = obtenerRegistros();

  const indice = registros.findIndex(r=>r.cedula===cedula);

  if(indice===-1){
    toast("Registro no encontrado", "error");
    return;
  }

  registros[indice] = {
    cedula,
    nombre1: document.getElementById("nombre1").value.trim(),
    nombre2: document.getElementById("nombre2").value.trim(),
    apellido1: document.getElementById("apellido1").value.trim(),
    apellido2: document.getElementById("apellido2").value.trim(),
    telefono: document.getElementById("telefono").value.trim(),
    direccion: document.getElementById("direccion").value.trim()
  };

  localStorage.setItem("registros", JSON.stringify(registros));

  sincronizarArchivo();

  toast("Registro actualizado", "exito");
}

function eliminarRegistro(){

  if(!confirm("¿Eliminar registro?")){
    return;
  }

  const cedula = document.getElementById("cedula").value.trim();

  let registros = obtenerRegistros();

  registros = registros.filter(r=>r.cedula!==cedula);

  localStorage.setItem("registros", JSON.stringify(registros));

  actualizarContador();

  sincronizarArchivo();

  toast("Eliminado", "exito");
}

function eliminarUsuario(){

  let correo = prompt("Ingrese correo o usuario del usuario a eliminar");

  if(!correo){
    return;
  }

  correo = correo.trim();

  let usuarios = JSON.parse(localStorage.getItem("usuarios"));

  const antes = usuarios.length;

  usuarios = usuarios.filter(u=>u.correo!==correo && u.usuario!==correo);

  if(usuarios.length===antes){
    toast("Usuario no encontrado", "error");
    return;
  }

  localStorage.setItem("usuarios", JSON.stringify(usuarios));

  sincronizarArchivo();

  toast("Usuario eliminado", "exito");
}

function actualizarContador(){
  document.getElementById("contador").innerText = obtenerRegistros().length;
}

/* ===================== ARCHIVO ÚNICO registros.xlsx ===================== */

const COLUMNAS = ["rol","nombre","usuario","correo","password","cedula",
                  "nombre1","nombre2","apellido1","apellido2","telefono","direccion"];

let archivoHandle = null;

function abrirDB(){
  return new Promise((res,rej)=>{
    try{
      const req = indexedDB.open("sistemaRegistro",1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore("archivos"); };
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    }catch(e){ rej(e); }
  });
}

async function guardarHandle(h){
  try{
    const db = await abrirDB();
    await new Promise((res,rej)=>{
      const tx = db.transaction("archivos","readwrite");
      tx.objectStore("archivos").put(h,"registros");
      tx.oncomplete = res;
      tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){}
}

async function obtenerHandleGuardado(){
  try{
    const db = await abrirDB();
    return await new Promise((res)=>{
      const tx = db.transaction("archivos","readonly");
      const r = tx.objectStore("archivos").get("registros");
      r.onsuccess = ()=>res(r.result || null);
      r.onerror = ()=>res(null);
    });
  }catch(e){ return null; }
}

function manejarAbrirArchivo(ev){
  if(window.showOpenFilePicker){
    ev.preventDefault();
    conectarArchivo();
    return false;
  }
  return true;
}

async function conectarArchivo(){

  if(!window.showOpenFilePicker){
    toast("Su navegador no permite guardar en el mismo archivo. Use Chrome o Edge.", "error");
    document.getElementById("archivoUsuarios").click();
    return;
  }

  try{
    const [h] = await window.showOpenFilePicker({
      multiple:false,
      types:[{ description:"Excel", accept:{
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]
      }}]
    });
    archivoHandle = h;
    await guardarHandle(h);
    if(await verificarPermiso(true)){
      await leerArchivoConectado();
    }
  }catch(e){
    if(e && e.name !== "AbortError"){
      toast("No se pudo abrir el archivo", "error");
    }
  }

  actualizarEstadoArchivo();
}

async function verificarPermiso(pedir){
  if(!archivoHandle){
    return false;
  }
  try{
    let p = await archivoHandle.queryPermission({mode:"readwrite"});
    if(p === "granted"){
      return true;
    }
    if(pedir){
      p = await archivoHandle.requestPermission({mode:"readwrite"});
    }
    return p === "granted";
  }catch(e){
    return false;
  }
}

async function leerArchivoConectado(){
  try{
    const file = await archivoHandle.getFile();
    const buf = await file.arrayBuffer();
    const libro = XLSX.read(new Uint8Array(buf), {type:"array"});
    const hoja = libro.Sheets[libro.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(hoja, {defval:""});
    if(filas.length===0){
      toast("El archivo no contiene datos", "error");
      return;
    }
    procesarFilas(filas);
    actualizarContador();
    toast("Conectado a " + archivoHandle.name + " (" + obtenerRegistros().length + " registros)", "exito");
  }catch(e){
    toast("Error al leer el archivo", "error");
  }
}

function procesarFilas(filas){

  const usuarios = [];
  const registros = [];

  filas.forEach(f=>{

    const rol = String(f.rol || f.Rol || f.tipo || f.Tipo || "estudiante").toLowerCase();

    const nombre = f.nombre || f.Nombre || "";
    const usuario = f.usuario || f.Usuario || "";
    const correo = f.correo || f.Correo || "";
    const cedula = f.cedula || f.Cedula || "";
    const password = f.password || f.Password || f["contraseña"] || f["Contraseña"] || "";
    const telefono = f.telefono || f.Telefono || "";
    const direccion = f.direccion || f.Direccion || "";
    const nombre1 = f.nombre1 || f.Nombre1 || "";
    const nombre2 = f.nombre2 || f.Nombre2 || "";
    const apellido1 = f.apellido1 || f.Apellido1 || "";
    const apellido2 = f.apellido2 || f.Apellido2 || "";

    if(rol.includes("admin")){
      usuarios.push({
        nombre: nombre || usuario,
        usuario,
        password: password || "123",
        rol:"admin"
      });
    }else{
      usuarios.push({
        nombre,
        correo,
        password: password || cedula,
        rol:"estudiante",
        cedula,
        telefono,
        direccion,
        nombre1,
        nombre2,
        apellido1,
        apellido2
      });

      if(cedula || nombre1 || apellido1){
        registros.push({cedula,nombre1,nombre2,apellido1,apellido2,telefono,direccion});
      }
    }
  });

  localStorage.setItem("usuarios", JSON.stringify(usuarios));
  localStorage.setItem("registros", JSON.stringify(registros));
}

function construirFilas(){

  const usuarios = JSON.parse(localStorage.getItem("usuarios") || "[]");
  const registros = obtenerRegistros();
  const filas = [];
  const usados = new Set();

  usuarios.forEach(u=>{

    if(u.rol === "admin"){
      filas.push({
        rol:"admin", nombre:u.nombre || u.usuario || "", usuario:u.usuario || "",
        correo:"", password:u.password || "", cedula:"", nombre1:"", nombre2:"",
        apellido1:"", apellido2:"", telefono:"", direccion:""
      });
      return;
    }

    const reg = registros.find(r=>r.cedula && u.cedula && r.cedula===u.cedula) || {};
    if(reg.cedula){
      usados.add(reg.cedula);
    }

    filas.push({
      rol:"estudiante",
      nombre: u.nombre || "",
      usuario: u.usuario || "",
      correo: u.correo || "",
      password: u.password || u.cedula || "",
      cedula: u.cedula || reg.cedula || "",
      nombre1: reg.nombre1 || u.nombre1 || "",
      nombre2: reg.nombre2 || u.nombre2 || "",
      apellido1: reg.apellido1 || u.apellido1 || "",
      apellido2: reg.apellido2 || u.apellido2 || "",
      telefono: reg.telefono || u.telefono || "",
      direccion: reg.direccion || u.direccion || ""
    });
  });

  registros.forEach(r=>{
    if(r.cedula && usados.has(r.cedula)){
      return;
    }
    filas.push({
      rol:"estudiante", nombre:"", usuario:"", correo:"",
      password: r.cedula || "", cedula: r.cedula || "",
      nombre1: r.nombre1 || "", nombre2: r.nombre2 || "",
      apellido1: r.apellido1 || "", apellido2: r.apellido2 || "",
      telefono: r.telefono || "", direccion: r.direccion || ""
    });
  });

  return filas;
}

async function guardarEnArchivo(mostrarMensaje){

  if(!archivoHandle){
    if(mostrarMensaje){
      toast("Conecte primero registros.xlsx", "error");
    }
    return false;
  }

  if(!await verificarPermiso(true)){
    toast("Permiso denegado para escribir el archivo", "error");
    return false;
  }

  try{
    const libro = XLSX.utils.book_new();
    const hoja = XLSX.utils.json_to_sheet(construirFilas(), {header:COLUMNAS});
    XLSX.utils.book_append_sheet(libro, hoja, "Registros");
    const datos = XLSX.write(libro, {bookType:"xlsx", type:"array"});
    const w = await archivoHandle.createWritable();
    await w.write(datos);
    await w.close();
    if(mostrarMensaje){
      toast("Guardado en " + archivoHandle.name, "exito");
    }
    return true;
  }catch(e){
    toast("No se pudo escribir el archivo (¿está abierto en Excel/LibreOffice?)", "error");
    return false;
  }
}

function sincronizarArchivo(){
  if(archivoHandle){
    guardarEnArchivo(false);
  }
}

async function guardarExcel(){
  if(archivoHandle){
    await guardarEnArchivo(true);
    return;
  }

  const filas = construirFilas();
  if(filas.length===0){
    toast("No hay registros para exportar", "error");
    return;
  }

  const libro = XLSX.utils.book_new();
  const hoja = XLSX.utils.json_to_sheet(filas, {header:COLUMNAS});
  XLSX.utils.book_append_sheet(libro, hoja, "Registros");
  XLSX.writeFile(libro, "registros.xlsx");
  toast("Archivo descargado (conecte el archivo para actualizarlo directamente)", "info");
}

function actualizarEstadoArchivo(){
  const texto = archivoHandle
    ? "Archivo conectado: " + archivoHandle.name + " — los cambios se guardan automáticamente."
    : "Sin archivo conectado. Conecte registros.xlsx para guardar en ese mismo archivo.";

  ["estadoArchivo","estadoArchivoPanel"].forEach(id=>{
    const el = document.getElementById(id);
    if(!el){
      return;
    }
    el.innerText = texto;
    el.classList.toggle("conectado", !!archivoHandle);
  });
}

function importarUsuarios(event){

  const archivo = event.target.files[0];

  if(!archivo){
    return;
  }

  const lector = new FileReader();

  lector.onload = function(e){

    try{

      const datos = new Uint8Array(e.target.result);
      const libro = XLSX.read(datos, {type:"array"});
      const hoja = libro.Sheets[libro.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(hoja, {defval:""});

      if(filas.length===0){
        toast("El archivo está vacío", "error");
        return;
      }

      procesarFilas(filas);

      actualizarContador();

      guardarEnArchivo(false);

      toast("Se importaron " + filas.length + " filas desde " + archivo.name, "exito");

      event.target.value = "";

    }catch(err){
      toast("Error al leer el archivo", "error");
    }
  };

  lector.readAsArrayBuffer(archivo);
}

(async function iniciarArchivo(){
  archivoHandle = await obtenerHandleGuardado();
  if(archivoHandle && await verificarPermiso(false)){
    await leerArchivoConectado();
  }else if(archivoHandle){
    archivoHandle = null;
  }
  actualizarEstadoArchivo();
})();
</script>
